seed: 42
dataset:
  size: 20
  split:
    train: 0.2
    dev: 0.2
    test: 0.6
  task_families:
  - preference_update
  - context_specific_preference
  - procedural_memory
  - spurious_semantic_trap
  - conflicting_memories
  - poisoned_memory
  - multi_hop_memory
  - abstention
openai:
  agent_model: gpt-4o-mini
  judge_model: gpt-4o
  dataset_model: gpt-4o-mini
  embedding_model: text-embedding-3-large
  temperature: 0.0
  max_output_tokens: 600
  use_api: true
  api_url: https://api.openai.com/v1
retrieval:
  top_k: 3
  hybrid:
    alpha: 0.7
    beta: 0.2
    gamma: 0.1
cmi:
  utility_threshold: 0.0
  stability_threshold: 0.0
  use_perturbation: true
  perturbation_types:
  - negation
  - scope_shift
  - temporal_shift
  - entity_swap
  scorer: hybrid
scoring:
  deterministic_weight: 0.7
  llm_judge_weight: 0.3
experiment:
  agents:
  - no_memory
  - full_history
  - vector_memory
  - summary_memory
  - reflection_memory
  - graph_memory
  - cmi
  max_examples: 8
  save_intermediate_outputs: true
  resume: true
  deterministic_only: false
  skip_llm_judge: false
run:
  dataset_path: data/generated/live_pilot_20.jsonl
  git_commit: HEAD
